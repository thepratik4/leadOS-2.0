services:
  db:
    image: postgres:16-alpine
    container_name: leados_db
    environment:
      POSTGRES_USER: leados
      POSTGRES_PASSWORD: leados_password
      POSTGRES_DB: leados_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leados -d leados_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leados_backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://leados:leados_password@db:5432/leados_db
      SEARCH_PROVIDER: ddgs
      SOURCE_FETCH_TIMEOUT_SECONDS: 8
      MAX_SOURCE_BYTES: 2097152
      MAX_CONCURRENT_FETCHES: 5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
